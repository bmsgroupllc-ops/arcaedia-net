document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

cefully -->\n\n<!-- ─── GA4 ───────────────────────────────────────── -->\n<!-- REPLACE: G-XXXXXXXXXX with your real GA4 Measurement ID -->\n<script async=\"\" src=\"f78dd89d-86b0-40e2-bfb0-c27f7cbe53c0\"><\u002Fscript>\n<script>\n  window.dataLayer = window.dataLayer || [];\n  function gtag(){dataLayer.push(arguments);}\n  gtag('js', new Date());\n  gtag('config', 'G-XXXXXXXXXX', { anonymize_ip: true });\n<\u002Fscript>\n\n<style>:root{\n    --bg: #080e1a;\n    --bg-2: #0b1424;\n    --card: #0f1a2e;\n    --card-hi: #14223a;\n    --border: #1a2a3a;\n    --border-hi: #243a55;\n    --cyan: #00d4ff;\n    --cyan-dim: #0099b8;\n    --gold: #f0c040;\n    --gold-dim: #b08a25;\n    --text: #f5f1e8;\n    --text-dim: #a6b1c2;\n    --text-mute: #6b7689;\n    --amber: #f0a040;\n    --red: #e85a4a;\n  }\n\n  *{ box-sizing: border-box; }\n  html, body{ margin:0; padding:0; background: var(--bg); color: var(--text); }\n  body{\n    font-family: 'DM Sans', system-ui, sans-serif;\n    font-size: 16px;\n    line-height: 1.5;\n    -webkit-font-smoothing: antialiased;\n    overflow-x: hidden;\n  }\n\n  h1,h2,h3,h4{\n    font-family: 'Playfair Display', Georgia, serif;\n    font-weight: 700;\n    letter-spacing: -0.01em;\n    margin: 0;\n    line-height: 1.1;\n    text-wrap: balance;\n  }\n\n  .mono{ font-family: 'DM Mono', monospace; }\n\n  .wrap{\n    max-width: 1240px;\n    margin: 0 auto;\n    padding: 0 32px;\n  }\n\n  /* ---------- HEADER ---------- */\n  .header{\n    position: sticky; top: 0; z-index: 100;\n    background: rgba(8,14,26,0.78);\n    backdrop-filter: blur(14px);\n    -webkit-backdrop-filter: blur(14px);\n    border-bottom: 1px solid var(--border);\n  }\n  .header-inner{\n    display: flex; align-items: center; justify-content: space-between;\n    height: 76px;\n  }\n  .logo{\n    font-family: 'Playfair Display', serif;\n    font-weight: 800;\n    font-size: 26px;\n    color: var(--cyan);\n    letter-spacing: -0.02em;\n    display: flex; align-items: center; gap: 10px;\n    text-decoration: none;\n  }\n  .logo-img{\n    height: 34px;\n    width: auto;\n    display: block;\n    /* Mask the white PNG to tint it cyan via brand color */\n    background-color: var(--cyan);\n    -webkit-mask: url(\"6483fe59-61a6-4cbf-b5a4-cab5a1bf147f\") center left / contain no-repeat;\n            mask: url(\"6483fe59-61a6-4cbf-b5a4-cab5a1bf147f\") center left / contain no-repeat;\n    aspect-ratio: 759 / 150;\n  }\n  .foot-brand .logo-img{ height: 32px; }\n  .logo-mark{\n    width: 30px; height: 30px;\n    border: 1.5px solid var(--cyan);\n    border-radius: 6px;\n    display: grid; place-items: center;\n    position: relative;\n    background: linear-gradient(135deg, rgba(0,212,255,0.18), transparent);\n  }\n  .logo-mark::before{\n    content:\"\"; position:absolute; inset: 6px;\n    border: 1.5px solid var(--cyan);\n    border-radius: 2px;\n    opacity: 0.55;\n  }\n  .nav{\n    display: flex; gap: 36px;\n    font-size: 14px;\n    font-weight: 500;\n  }\n  .nav a{\n    color: var(--text-dim);\n    text-decoration: none;\n    transition: color .15s;\n    position: relative;\n    padding: 4px 0;\n  }\n  .nav a:hover{ color: var(--text); }\n  .nav a:hover::after{\n    content:\"\"; position: absolute; left:0; right:0; bottom:-2px;\n    height: 1px; background: var(--cyan);\n  }\n  .header-cta{\n    display: inline-flex; align-items: center; gap: 8px;\n    padding: 11px 18px;\n    border: 1.5px solid var(--gold);\n    color: var(--gold);\n    border-radius: 4px;\n    font-weight: 500;\n    font-size: 13.5px;\n    text-decoration: none;\n    font-family: 'DM Mono', monospace;\n    transition: all .18s;\n    background: rgba(240,192,64,0.04);\n  }\n  .header-cta:hover{\n    background: var(--gold); color: var(--bg);\n  }\n  .header-cta svg{ width: 14px; height: 14px; }\n\n  /* ---------- HERO ---------- */\n  .hero{\n    position: relative;\n    padding: 120px 0 100px;\n    overflow: hidden;\n  }\n  .hero-grid{\n    position: absolute; inset: 0;\n    background-image:\n      linear-gradient(rgba(0,212,255,0.06) 1px, transparent 1px),\n      linear-gradient(90deg, rgba(0,212,255,0.06) 1px, transparent 1px);\n    background-size: 56px 56px;\n    mask-image: radial-gradient(ellipse 70% 60% at 50% 35%, #000 30%, transparent 75%);\n    -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 35%, #000 30%, transparent 75%);\n    pointer-events: none;\n  }\n  .hero-glow{\n    position: absolute; left: 50%; top: 0;\n    transform: translateX(-50%);\n    width: 800px; height: 600px;\n    background: radial-gradient(ellipse at center top, rgba(0,212,255,0.18), transparent 60%);\n    pointer-events: none;\n  }\n  .hero-inner{\n    position: relative;\n    text-align: center;\n    max-width: 920px;\n    margin: 0 auto;\n  }\n  .hero-eyebrow{\n    display: inline-flex; align-items: center; gap: 10px;\n    font-family: 'DM Mono', monospace;\n    font-size: 12px;\n    color: var(--cyan);\n    letter-spacing: 0.12em;\n    text-transform: uppercase;\n    padding: 7px 14px;\n    border: 1px solid rgba(0,212,255,0.3);\n    border-radius: 999px;\n    background: rgba(0,212,255,0.05);\n    margin-bottom: 32px;\n  }\n  .hero-eyebrow .dot{\n    width: 6px; height: 6px; border-radius: 50%;\n    background: var(--cyan);\n    box-shadow: 0 0 8px var(--cyan);\n    animation: pulse 2s infinite;\n  }\n  @keyframes pulse{\n    0%,100%{ opacity: 1; }\n    50%{ opacity: 0.35; }\n  }\n  h1.hero-title{\n    font-size: clamp(44px, 6.4vw, 84px);\n    line-height: 1.02;\n    margin-bottom: 28px;\n  }\n  h1.hero-title .accent{\n    font-style: italic;\n    color: var(--gold);\n    font-weight: 500;\n  }\n  .hero-sub{\n    font-size: 19px;\n    color: var(--text-dim);\n    max-width: 640px;\n    margin: 0 auto 40px;\n    line-height: 1.55;\n  }\n  .hero-sub strong{\n    color: var(--text);\n    font-weight: 500;\n  }\n  .hero-ctas{\n    display: flex; justify-content: center; gap: 14px;\n    flex-wrap: wrap;\n  }\n  .btn{\n    display: inline-flex; align-items: center; gap: 10px;\n    padding: 16px 26px;\n    border-radius: 4px;\n    font-weight: 600;\n    font-size: 15px;\n    text-decoration: none;\n    cursor: pointer;\n    border: none;\n    transition: all .18s ease;\n    font-family: inherit;\n  }\n  .btn-primary{\n    background: var(--cyan);\n    color: var(--bg);\n    box-shadow: 0 0 0 1px var(--cyan), 0 10px 30px -10px rgba(0,212,255,0.6);\n  }\n  .btn-primary:hover{\n    background: #4ee0ff;\n    box-shadow: 0 0 0 1px #4ee0ff, 0 14px 36px -8px rgba(0,212,255,0.75);\n    transform: translateY(-1px);\n  }\n  .btn-outline{\n    background: transparent;\n    color: var(--text);\n    border: 1.5px solid var(--border-hi);\n  }\n  .btn-outline:hover{\n    border-color: var(--cyan);\n    color: var(--cyan);\n  }\n  .badges{\n    display: flex; justify-content: center; gap: 10px;\n    flex-wrap: wrap;\n    margin-top: 48px;\n  }\n  .badge{\n    display: inline-flex; align-items: center; gap: 8px;\n    padding: 9px 14px;\n    background: rgba(15,26,46,0.6);\n    border: 1px solid var(--border);\n    border-radius: 999px;\n    font-family: 'DM Mono', monospace;\n    font-size: 12px;\n    color: var(--text-dim);\n    letter-spacing: 0.01em;\n  }\n  .badge .chk{\n    width: 14px; height: 14px;\n    border-radius: 50%;\n    background: rgba(0,212,255,0.15);\n    color: var(--cyan);\n    display: grid; place-items: center;\n    font-size: 9px;\n    font-weight: 700;\n  }\n\n  /* ---------- URGENCY BANNER ---------- */\n  .urgency{\n    background:\n      linear-gradient(90deg, rgba(232,90,74,0.12), rgba(240,160,64,0.12), rgba(232,90,74,0.12));\n    border-top: 1px solid rgba(232,90,74,0.35);\n    border-bottom: 1px solid rgba(232,90,74,0.35);\n    padding: 22px 0;\n    position: relative;\n    overflow: hidden;\n  }\n  .urgency::before{\n    content:\"\"; position: absolute; inset: 0;\n    background:\n      repeating-linear-gradient(135deg,\n        transparent 0 18px,\n        rgba(232,90,74,0.04) 18px 36px);\n    pointer-events: none;\n  }\n  .urgency-inner{\n    position: relative;\n    display: flex; align-items: center; gap: 18px;\n    justify-content: center;\n    text-align: left;\n  }\n  .urgency-icon{\n    flex: none;\n    width: 44px; height: 44px;\n    background: rgba(232,90,74,0.18);\n    border: 1px solid rgba(232,90,74,0.5);\n    border-radius: 50%;\n    display: grid; place-items: center;\n    color: var(--amber);\n    font-size: 20px;\n  }\n  .urgency-text{\n    font-size: 15px;\n    color: var(--text);\n    max-width: 880px;\n  }\n  .urgency-text strong{\n    color: var(--amber);\n    font-weight: 600;\n  }\n  .urgency-tag{\n    font-family: 'DM Mono', monospace;\n    font-size: 11px;\n    color: var(--red);\n    text-transform: uppercase;\n    letter-spacing: 0.15em;\n    margin-bottom: 2px;\n    display: block;\n  }\n\n  /* ---------- SECTIONS ---------- */\n  section.block{\n    padding: 110px 0;\n    position: relative;\n  }\n  .section-head{\n    text-align: center;\n    max-width: 720px;\n    margin: 0 auto 64px;\n  }\n  .section-eyebrow{\n    font-family: 'DM Mono', monospace;\n    font-size: 12px;\n    color: var(--cyan);\n    letter-spacing: 0.18em;\n    text-transform: uppercase;\n    margin-bottom: 16px;\n  }\n  h2.section-title{\n    font-size: clamp(34px, 4.4vw, 52px);\n    margin-bottom: 18px;\n  }\n  .section-sub{\n    font-size: 17px;\n    color: var(--text-dim);\n    line-height: 1.55;\n  }\n\n  /* ---------- 3-STEP PROCESS ---------- */\n  .process{\n    display: grid;\n    grid-template-columns: repeat(3, 1fr);\n    gap: 24px;\n    position: relative;\n  }\n  .process::before{\n    content:\"\"; position: absolute;\n    top: 56px; left: 14%; right: 14%;\n    height: 1px;\n    background: linear-gradient(90deg,\n      transparent,\n      rgba(0,212,255,0.5) 20%,\n      rgba(240,192,64,0.5) 50%,\n      rgba(0,212,255,0.5) 80%,\n      transparent);\n    z-index: 0;\n  }\n  .step{\n    background: var(--card);\n    border: 1px solid var(--
